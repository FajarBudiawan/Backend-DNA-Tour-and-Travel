openapi: 3.0.3
info:
  title: 'DNA Tour & Travel API Documentation'
  description: 'Dokumentasi resmi API Backend DNA Tour & Travel Umrah Management System.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Endpoints
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Setiap request membutuhkan header `Authorization: Bearer {token}` yang didapatkan setelah berhasil login melalui endpoint `POST /api/login`.'
security:
  -
    default: []
paths:
  /api/login:
    post:
      summary: ''
      operationId: postApiLogin
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: architecto
              required:
                - email
                - password
  /api/logout:
    post:
      summary: ''
      operationId: postApiLogout
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
  /api/me:
    get:
      summary: ''
      operationId: getApiMe
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
                properties:
                  message:
                    type: string
                    example: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
      tags:
        - Endpoints
  /api/hotels:
    get:
      summary: 'Menampilkan daftar hotel (dengan opsional filter per kota).'
      operationId: menampilkanDaftarHoteldenganOpsionalFilterPerKota
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
                properties:
                  message:
                    type: string
                    example: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
      tags:
        - Endpoints
  /api/hotels/find-or-create:
    post:
      summary: 'Cari hotel berdasarkan nama & kota (case-insensitive exact match).'
      operationId: cariHotelBerdasarkanNamaKotacaseInsensitiveExactMatch
      description: "Jika ditemukan: kembalikan hotel yang ada.\nJika tidak ditemukan: buat hotel baru dan kembalikan data hotel baru."
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 150 characters.'
                  example: b
                city:
                  type: string
                  description: ''
                  example: Makkah
                  enum:
                    - Makkah
                    - Madinah
              required:
                - name
                - city
  /api/packages:
    get:
      summary: 'Menampilkan semua data paket Umrah (dengan pencarian & filter).'
      operationId: menampilkanSemuaDataPaketUmrahdenganPencarianFilter
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
                properties:
                  message:
                    type: string
                    example: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
      tags:
        - Endpoints
    post:
      summary: 'Membuat paket Umrah baru.'
      operationId: membuatPaketUmrahBaru
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 150 characters.'
                  example: b
                category:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: 'n'
                  nullable: true
                status:
                  type: string
                  description: ''
                  example: published
                  enum:
                    - draft
                    - published
                    - inactive
                  nullable: true
                is_featured:
                  type: boolean
                  description: ''
                  example: true
                  nullable: true
              required:
                - name
  '/api/packages/{package_id}':
    get:
      summary: 'Menampilkan detail satu paket Umrah.'
      operationId: menampilkanDetailSatuPaketUmrah
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
                properties:
                  message:
                    type: string
                    example: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
      tags:
        - Endpoints
    put:
      summary: 'Perbarui data paket Umrah.'
      operationId: perbaruiDataPaketUmrah
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 150 characters.'
                  example: b
                category:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: 'n'
                  nullable: true
                status:
                  type: string
                  description: ''
                  example: inactive
                  enum:
                    - draft
                    - published
                    - inactive
                is_featured:
                  type: boolean
                  description: ''
                  example: true
    delete:
      summary: 'Hapus data paket Umrah.'
      operationId: hapusDataPaketUmrah
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
    parameters:
      -
        in: path
        name: package_id
        description: 'The ID of the package.'
        example: 019fff58-a57b-7024-9105-8669a2b8faeb
        required: true
        schema:
          type: string
  '/api/packages/{package_id}/itineraries':
    get:
      summary: 'Display a listing of itineraries for a package.'
      operationId: displayAListingOfItinerariesForAPackage
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
                properties:
                  message:
                    type: string
                    example: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
      tags:
        - Endpoints
    post:
      summary: 'Store a newly created itinerary for a package.'
      operationId: storeANewlyCreatedItineraryForAPackage
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                day_number:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 16
                title:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
                activity_time:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                location:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
                  nullable: true
                category:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: g
                  nullable: true
                description:
                  type: string
                  description: ''
                  example: 'Eius et animi quos velit et.'
                  nullable: true
              required:
                - day_number
                - title
    parameters:
      -
        in: path
        name: package_id
        description: 'The ID of the package.'
        example: 019fff58-a57b-7024-9105-8669a2b8faeb
        required: true
        schema:
          type: string
  '/api/packages/{package_id}/itineraries/{itinerary_id}':
    put:
      summary: 'Update the specified itinerary template and sync to un-customized kloter schedules.'
      operationId: updateTheSpecifiedItineraryTemplateAndSyncToUnCustomizedKloterSchedules
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                day_number:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 16
                title:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
                activity_time:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                location:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
                  nullable: true
                category:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: g
                  nullable: true
                description:
                  type: string
                  description: ''
                  example: 'Eius et animi quos velit et.'
                  nullable: true
    delete:
      summary: 'Remove the specified itinerary template.'
      operationId: removeTheSpecifiedItineraryTemplate
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
    parameters:
      -
        in: path
        name: package_id
        description: 'The ID of the package.'
        example: 019fff58-a57b-7024-9105-8669a2b8faeb
        required: true
        schema:
          type: string
      -
        in: path
        name: itinerary_id
        description: 'The ID of the itinerary.'
        example: 01a06c85-f2ba-713e-8952-deab62b1c219
        required: true
        schema:
          type: string
  /api/kloters:
    get:
      summary: 'Menampilkan semua data kloter keberangkatan (dengan pencarian & filter).'
      operationId: menampilkanSemuaDataKloterKeberangkatandenganPencarianFilter
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
                properties:
                  message:
                    type: string
                    example: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
      tags:
        - Endpoints
    post:
      summary: 'Membuat kloter keberangkatan baru.'
      operationId: membuatKloterKeberangkatanBaru
      description: 'package_id, departure_date, return_date sekarang NULLABLE (keputusan klien).'
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 150 characters.'
                  example: b
                package_id:
                  type: string
                  description: 'Must be a valid UUID. Must match an existing stored value.'
                  example: a4855dc5-0acb-33c3-b921-f4291f719ca0
                  nullable: true
                code:
                  type: string
                  description: 'Must not be greater than 30 characters.'
                  example: z
                  nullable: true
                flight_code:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: m
                  nullable: true
                departure_date:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-09-04T17:01:13'
                  nullable: true
                return_date:
                  type: string
                  description: 'Must be a valid date. Must be a date after or equal to <code>departure_date</code>.'
                  example: '2052-09-27'
                  nullable: true
                hotel_makkah_id:
                  type: string
                  description: 'Must be a valid UUID. Must match an existing stored value.'
                  example: a4855dc5-0acb-33c3-b921-f4291f719ca0
                  nullable: true
                hotel_madinah_id:
                  type: string
                  description: 'Must be a valid UUID. Must match an existing stored value.'
                  example: c90237e9-ced5-3af6-88ea-84aeaa148878
                  nullable: true
                status:
                  type: string
                  description: ''
                  example: draft
                  enum:
                    - draft
                    - active
                    - ready
                    - completed
                    - cancelled
                  nullable: true
                tour_leader:
                  type: string
                  description: 'Must not be greater than 200 characters.'
                  example: i
                  nullable: true
                mutawif_local:
                  type: string
                  description: 'Must not be greater than 200 characters.'
                  example: 'y'
                  nullable: true
              required:
                - name
  '/api/kloters/{kloter_id}':
    get:
      summary: 'Menampilkan detail satu kloter keberangkatan beserta daftar jamaah.'
      operationId: menampilkanDetailSatuKloterKeberangkatanBesertaDaftarJamaah
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
                properties:
                  message:
                    type: string
                    example: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
      tags:
        - Endpoints
    put:
      summary: 'Perbarui data kloter keberangkatan.'
      operationId: perbaruiDataKloterKeberangkatan
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 150 characters.'
                  example: b
                package_id:
                  type: string
                  description: 'Must be a valid UUID. Must match an existing stored value.'
                  example: a4855dc5-0acb-33c3-b921-f4291f719ca0
                  nullable: true
                code:
                  type: string
                  description: 'Must not be greater than 30 characters.'
                  example: z
                  nullable: true
                flight_code:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: m
                  nullable: true
                departure_date:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-09-04T17:01:13'
                  nullable: true
                return_date:
                  type: string
                  description: 'Must be a valid date. Must be a date after or equal to <code>departure_date</code>.'
                  example: '2052-09-27'
                  nullable: true
                hotel_makkah_id:
                  type: string
                  description: 'Must be a valid UUID. Must match an existing stored value.'
                  example: a4855dc5-0acb-33c3-b921-f4291f719ca0
                  nullable: true
                hotel_madinah_id:
                  type: string
                  description: 'Must be a valid UUID. Must match an existing stored value.'
                  example: c90237e9-ced5-3af6-88ea-84aeaa148878
                  nullable: true
                status:
                  type: string
                  description: ''
                  example: cancelled
                  enum:
                    - draft
                    - active
                    - ready
                    - completed
                    - cancelled
                tour_leader:
                  type: string
                  description: 'Must not be greater than 200 characters.'
                  example: i
                  nullable: true
                mutawif_local:
                  type: string
                  description: 'Must not be greater than 200 characters.'
                  example: 'y'
                  nullable: true
    delete:
      summary: 'Hapus data kloter keberangkatan.'
      operationId: hapusDataKloterKeberangkatan
      description: "Guard: tidak boleh dihapus jika masih ada jamaah ter-assign via jamaah.kloter_id\n(single source of truth — menggantikan pengecekan via registrations() lama)."
      parameters: []
      responses: {}
      tags:
        - Endpoints
    parameters:
      -
        in: path
        name: kloter_id
        description: 'The ID of the kloter.'
        example: 019fff5a-e6a2-72d5-8f7d-8814ad6f0c89
        required: true
        schema:
          type: string
  '/api/kloters/{kloter_id}/schedules':
    get:
      summary: 'Display a listing of schedules for a kloter.'
      operationId: displayAListingOfSchedulesForAKloter
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
                properties:
                  message:
                    type: string
                    example: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
      tags:
        - Endpoints
    post:
      summary: 'Store a manually created schedule for a kloter.'
      operationId: storeAManuallyCreatedScheduleForAKloter
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                day_number:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 16
                  nullable: true
                activity_date:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-09-04T17:01:13'
                activity_time:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                hijri_date_ref:
                  type: string
                  description: 'Must not be greater than 30 characters.'
                  example: 'n'
                  nullable: true
                title:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: g
                location:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: z
                  nullable: true
                category:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: m
                  nullable: true
                pic:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: i
                  nullable: true
                status:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: 'y'
                  nullable: true
                description:
                  type: string
                  description: ''
                  example: 'Eius et animi quos velit et.'
                  nullable: true
                is_published:
                  type: boolean
                  description: ''
                  example: false
                  nullable: true
              required:
                - activity_date
                - title
    parameters:
      -
        in: path
        name: kloter_id
        description: 'The ID of the kloter.'
        example: 019fff5a-e6a2-72d5-8f7d-8814ad6f0c89
        required: true
        schema:
          type: string
  '/api/kloters/{kloter_id}/schedules/{schedule_id}':
    put:
      summary: 'Update the specified schedule for a kloter.'
      operationId: updateTheSpecifiedScheduleForAKloter
      description: 'Note: Manual update automatically sets is_customized = true.'
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                day_number:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 16
                activity_date:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-09-04T17:01:13'
                activity_time:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                hijri_date_ref:
                  type: string
                  description: 'Must not be greater than 30 characters.'
                  example: 'n'
                  nullable: true
                title:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: g
                location:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: z
                  nullable: true
                category:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: m
                  nullable: true
                pic:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: i
                  nullable: true
                status:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: 'y'
                  nullable: true
                description:
                  type: string
                  description: ''
                  example: 'Eius et animi quos velit et.'
                  nullable: true
                is_published:
                  type: boolean
                  description: ''
                  example: true
                  nullable: true
    delete:
      summary: 'Remove the specified schedule from a kloter.'
      operationId: removeTheSpecifiedScheduleFromAKloter
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
    parameters:
      -
        in: path
        name: kloter_id
        description: 'The ID of the kloter.'
        example: 019fff5a-e6a2-72d5-8f7d-8814ad6f0c89
        required: true
        schema:
          type: string
      -
        in: path
        name: schedule_id
        description: 'The ID of the schedule.'
        example: 01a06c86-0384-702f-b748-164626d2fd9f
        required: true
        schema:
          type: string
  '/api/kloters/{kloter_id}/schedules/generate-from-template':
    post:
      summary: 'Generate or sync kloter rundown schedules from Package Itinerary templates.'
      operationId: generateOrSyncKloterRundownSchedulesFromPackageItineraryTemplates
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
    parameters:
      -
        in: path
        name: kloter_id
        description: 'The ID of the kloter.'
        example: 019fff5a-e6a2-72d5-8f7d-8814ad6f0c89
        required: true
        schema:
          type: string
  '/api/kloters/{kloter_id}/rooms':
    get:
      summary: 'Menampilkan semua kamar dan anggota dalam satu kloter.'
      operationId: menampilkanSemuaKamarDanAnggotaDalamSatuKloter
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
                properties:
                  message:
                    type: string
                    example: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
      tags:
        - Endpoints
    parameters:
      -
        in: path
        name: kloter_id
        description: 'The ID of the kloter.'
        example: 019fff5a-e6a2-72d5-8f7d-8814ad6f0c89
        required: true
        schema:
          type: string
  '/api/kloters/{kloter_id}/auto-assign-rooms':
    post:
      summary: 'Pembagian Kamar Otomatis (Auto Allocation Roommates).'
      operationId: pembagianKamarOtomatisAutoAllocationRoommates
      description: '// DEPRECATED sementara: endpoint ini bergantung pada registration_id dari tabel registrations.'
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                room_type:
                  type: string
                  description: ''
                  example: triple
                  enum:
                    - quad
                    - triple
                    - double
                    - single
                    - quint
                  nullable: true
                hotel_id:
                  type: string
                  description: 'Must be a valid UUID. Must match an existing stored value.'
                  example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
                  nullable: true
    parameters:
      -
        in: path
        name: kloter_id
        description: 'The ID of the kloter.'
        example: 019fff5a-e6a2-72d5-8f7d-8814ad6f0c89
        required: true
        schema:
          type: string
  /api/rooms:
    post:
      summary: 'Membuat kamar secara manual oleh Admin.'
      operationId: membuatKamarSecaraManualOlehAdmin
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kloter_id:
                  type: string
