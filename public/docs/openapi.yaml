openapi: 3.0.3
info:
  title: 'DNA Tour & Travel API Documentation'
  description: 'Dokumentasi resmi API Backend DNA Tour & Travel Umrah Management System.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: 'Perjalanan / Schedule'
    description: "\nAPI untuk mengelola data jadwal perjalanan."
  -
    name: 'Modul Darurat / Emergency / SOS'
    description: "\nAPI untuk mengelola laporan kejadian darurat (SOS Incident) dari Jamaah dan penanganannya oleh Admin/Tour Leader."
  -
    name: Endpoints
    description: ''
  -
    name: 'Mobile Authentication'
    description: 'Autentikasi untuk pengguna Mobile App (Jamaah, Anggota Keluarga, dan Tour Leader) menggunakan Laravel Sanctum dengan ability token berbasis role.'
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Setiap request membutuhkan header `Authorization: Bearer {token}` yang didapatkan setelah berhasil login melalui endpoint `POST /api/login`.'
security:
  -
    default: []
paths:
  /api/schedules:
    get:
      summary: 'Mengambil daftar perjalanan'
      operationId: mengambilDaftarPerjalanan
      description: 'Mendukung search dan filter berdasarkan query parameter.'
      parameters:
        -
          in: query
          name: q
          description: 'Kata kunci pencarian pada title, location, keterangan, atau pic.'
          example: Ziarah
          required: false
          schema:
            type: string
            description: 'Kata kunci pencarian pada title, location, keterangan, atau pic.'
            example: Ziarah
        -
          in: query
          name: category
          description: 'Filter berdasarkan kategori kegiatan.'
          example: Ibadah
          required: false
          schema:
            type: string
            description: 'Filter berdasarkan kategori kegiatan.'
            example: Ibadah
        -
          in: query
          name: date
          description: 'Filter berdasarkan tanggal (YYYY-MM-DD).'
          example: '2026-09-10'
          required: false
          schema:
            type: string
            description: 'Filter berdasarkan tanggal (YYYY-MM-DD).'
            example: '2026-09-10'
        -
          in: query
          name: day_number
          description: 'Filter berdasarkan nomor hari.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Filter berdasarkan nomor hari.'
            example: 1
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
                properties:
                  message:
                    type: string
                    example: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
      tags:
        - 'Perjalanan / Schedule'
    post:
      summary: 'Menambahkan perjalanan baru'
      operationId: menambahkanPerjalananBaru
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Perjalanan / Schedule'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                day_number:
                  type: integer
                  description: 'Nomor hari ke berapa.'
                  example: 1
                  nullable: true
                date:
                  type: string
                  description: 'Format tanggal YYYY-MM-DD.'
                  example: '2026-09-10'
                time:
                  type: string
                  description: 'Format waktu HH:MM.'
                  example: '08:00'
                title:
                  type: string
                  description: 'Judul kegiatan perjalanan.'
                  example: 'Ziarah Kota Madinah'
                category:
                  type: string
                  description: 'Kategori kegiatan.'
                  example: Ziarah
                  nullable: true
                location:
                  type: string
                  description: 'Lokasi kegiatan.'
                  example: 'Masjid Nabawi'
                  nullable: true
                keterangan:
                  type: string
                  description: 'Keterangan/deskripsi kegiatan.'
                  example: 'Berkumpul di lobby hotel tepat waktu'
                  nullable: true
                pic:
                  type: string
                  description: 'Person in charge / penanggung jawab.'
                  example: 'Ustadz Ahmad'
                  nullable: true
                status_override:
                  type: string
                  description: 'Status override jika ingin menentukan status secara manual (upcoming, in_progress, completed).'
                  example: upcoming
                  nullable: true
  '/api/schedules/{schedule_id}':
    get:
      summary: 'Mengambil detail perjalanan'
      operationId: mengambilDetailPerjalanan
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
                properties:
                  message:
                    type: string
                    example: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
      tags:
        - 'Perjalanan / Schedule'
    put:
      summary: 'Memperbarui data perjalanan'
      operationId: memperbaruiDataPerjalanan
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Perjalanan / Schedule'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                day_number:
                  type: integer
                  description: 'Nomor hari ke berapa.'
                  example: 1
                date:
                  type: string
                  description: 'Format tanggal YYYY-MM-DD.'
                  example: '2026-09-10'
                time:
                  type: string
                  description: 'Format waktu HH:MM.'
                  example: '09:00'
                title:
                  type: string
                  description: 'Judul kegiatan perjalanan.'
                  example: 'Ziarah Kota Madinah (Updated)'
                category:
                  type: string
                  description: 'Kategori kegiatan.'
                  example: Ziarah
                  nullable: true
                location:
                  type: string
                  description: 'Lokasi kegiatan.'
                  example: 'Masjid Nabawi'
                  nullable: true
                keterangan:
                  type: string
                  description: 'Keterangan/deskripsi kegiatan.'
                  example: 'Berkumpul di lobby hotel'
                  nullable: true
                pic:
                  type: string
                  description: 'Person in charge / penanggung jawab.'
                  example: 'Ustadz Ahmad'
                  nullable: true
                status_override:
                  type: string
                  description: 'Status override (upcoming, in_progress, completed).'
                  example: in_progress
                  nullable: true
    delete:
      summary: 'Menghapus perjalanan'
      operationId: menghapusPerjalanan
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Perjalanan / Schedule'
    parameters:
      -
        in: path
        name: schedule_id
        description: 'The ID of the schedule.'
        example: 4
        required: true
        schema:
          type: integer
      -
        in: path
        name: schedule
        description: 'ID Schedule.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/schedules/{schedule_id}/status':
    patch:
      summary: 'Memperbarui status override perjalanan'
      operationId: memperbaruiStatusOverridePerjalanan
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Perjalanan / Schedule'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status_override:
                  type: string
                  description: 'Status override baru (upcoming, in_progress, completed).'
                  example: in_progress
              required:
                - status_override
    parameters:
      -
        in: path
        name: schedule_id
        description: 'The ID of the schedule.'
        example: 4
        required: true
        schema:
          type: integer
      -
        in: path
        name: schedule
        description: 'ID Schedule.'
        example: 1
        required: true
        schema:
          type: integer
  /api/sos-incidents:
    get:
      summary: 'Menampilkan daftar SOS Incident'
      operationId: menampilkanDaftarSOSIncident
      description: "Menampilkan daftar laporan SOS yang dapat diakses oleh user sesuai ability token autentikasi.\n\n**Scope Akses Berdasarkan Role:**\n* **Admin (`admin`):** Memiliki akses penuh untuk melihat seluruh laporan SOS dari semua kloter.\n* **Tour Leader (`tour_leader`):** Hanya dapat melihat laporan SOS dari kloter yang ditugaskan kepadanya.\n* **Jamaah (`jamaah`):** Hanya dapat melihat laporan SOS miliknya sendiri.\n\nData diurutkan berdasarkan `triggered_at` terbaru dan menyertakan eager-load relasi `jamaah` (id, full_name, phone), `kloter` (id, name), serta jumlah tanggapan (`responses_count`)."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
                properties:
                  message:
                    type: string
                    example: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
      tags:
        - 'Modul Darurat / Emergency / SOS'
    post:
      summary: 'Membuat laporan SOS baru'
      operationId: membuatLaporanSOSBaru
      description: "Membuat laporan kejadian darurat (SOS Incident) baru.\n\n**Aturan Autentikasi & Authorization:**\n* **Jamaah (`jamaah`):** Dapat membuat SOS untuk dirinya sendiri. Field `jamaah_id` **tidak perlu dikirim** oleh client karena diisi otomatis dari token Jamaah.\n* **Admin (`admin`):** Dapat membuat SOS atas nama Jamaah dan **wajib menentukan** `jamaah_id` di request body. Jika `jamaah_id` kosong/tidak disertakan, mengembalikan response error `422 Unprocessable Entity`.\n* **Tour Leader (`tour_leader`):** **Tidak diperbolehkan** membuat SOS dan menghasilkan response error `403 Forbidden` (`Tour Leader tidak dapat membuat SOS.`).\n\n**Aturan Penentuan Field Otomatis oleh Backend:**\n* `kloter_id`: Diambil otomatis dari `jamaah.kloter_id`.\n* `status`: Bernilai awal `'triggered'`.\n* `triggered_at`: Diisi otomatis dengan timestamp `now()`.\n* Record awal pada `sos_status_histories` dibuat otomatis (`old_status: null`, `new_status: 'triggered'`)."
      parameters: []
      responses: {}
      tags:
        - 'Modul Darurat / Emergency / SOS'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jamaah_id:
                  type: string
                  description: 'UUID Jamaah yang mengalami darurat. Wajib dikirim oleh Admin, diabaikan/diisi otomatis jika login sebagai Jamaah.'
                  example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                  nullable: true
                type:
                  type: string
                  description: 'Jenis kejadian darurat (misal: "Darurat Medis", "Tersesat", "Kecelakaan").'
                  example: 'Darurat Medis'
                description:
                  type: string
                  description: 'Rincian deskripsi kondisi darurat yang dialami.'
                  example: 'Jamaah mengalami pusing dan sesak napas.'
                  nullable: true
                location_name:
                  type: string
                  description: 'Nama lokasi atau deskripsi landmark tempat kejadian.'
                  example: 'Pelataran Tawaf Gate 1'
                  nullable: true
                latitude:
                  type: number
                  description: 'Koordinat latitude lokasi kejadian (-90 s/d 90).'
                  example: 21.4225
                longitude:
                  type: number
                  description: 'Koordinat longitude lokasi kejadian (-180 s/d 180).'
                  example: 39.8262
              required:
                - type
                - latitude
                - longitude
  '/api/sos-incidents/{sosIncident_id}':
    get:
      summary: 'Menampilkan detail satu SOS Incident'
      operationId: menampilkanDetailSatuSOSIncident
      description: "Menampilkan rincian informasi satu laporan kejadian SOS Incident beserta relasi Jamaah, Kloter, Responses, dan Status Histories.\n\n**Scope Akses Berdasarkan Role:**\n* **Admin (`admin`):** Dapat melihat detail laporan SOS manapun.\n* **Tour Leader (`tour_leader`):** Hanya dapat melihat detail SOS jika kloter incident sesuai dengan kloter assignment-nya.\n* **Jamaah (`jamaah`):** Hanya dapat melihat detail SOS miliknya sendiri."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
                properties:
                  message:
                    type: string
                    example: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
      tags:
        - 'Modul Darurat / Emergency / SOS'
    parameters:
      -
        in: path
        name: sosIncident_id
        description: 'The ID of the sosIncident.'
        example: 01a0d96c-1e72-7144-83eb-2a1d35530e00
        required: true
        schema:
          type: string
      -
        in: path
        name: sosIncident
        description: 'UUID laporan SOS Incident.'
        example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        required: true
        schema:
          type: string
  '/api/sos-incidents/{sosIncident_id}/status':
    patch:
      summary: 'Mengubah status SOS Incident'
      operationId: mengubahStatusSOSIncident
      description: "Memperbarui status penanganan laporan SOS Incident dan mencatat riwayat perubahannya ke `sos_status_histories`.\n\n**Aturan Hak Akses:**\n* **Jamaah (`jamaah`):** **Tidak dapat** mengubah status SOS. Menghasilkan response `403 Forbidden` (`Jamaah tidak dapat mengubah status SOS.`).\n* **Admin (`admin`):** Dapat mengubah status SOS mana saja jika memiliki akses. Aktor pencatat pada `sos_status_histories` disimpan di kolom `changed_by`.\n* **Tour Leader (`tour_leader`):** Dapat mengubah status SOS jika memiliki akses terhadap incident (kloter assignment). Aktor pencatat pada `sos_status_histories` disimpan di kolom `tour_leader_id`.\n\n**Nilai Status yang Diperbolehkan:**\n* `triggered`: Laporan SOS baru terpicu.\n* `acknowledged`: Laporan telah diterima/dikonfirmasi oleh Petugas/TL.\n* `in_action`: Petugas/TL sedang dalam penanganan di lapangan.\n* `resolved`: Kejadian darurat telah selesai ditangani.\n* `false_alarm`: Laporan palsu / tidak sengaja tertekan."
      parameters: []
      responses: {}
      tags:
        - 'Modul Darurat / Emergency / SOS'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: 'Status baru yang valid (`triggered`, `acknowledged`, `in_action`, `resolved`, `false_alarm`).'
                  example: acknowledged
              required:
                - status
    parameters:
      -
        in: path
        name: sosIncident_id
        description: 'The ID of the sosIncident.'
        example: 01a0d96c-1e72-7144-83eb-2a1d35530e00
        required: true
        schema:
          type: string
      -
        in: path
        name: sosIncident
        description: 'UUID laporan SOS Incident.'
        example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        required: true
        schema:
          type: string
  '/api/sos-incidents/{sosIncident_id}/responses':
    get:
      summary: 'Menampilkan daftar response pada SOS Incident'
      operationId: menampilkanDaftarResponsePadaSOSIncident
      description: "Menampilkan seluruh daftar tanggapan/keterangan penanganan pada satu laporan SOS Incident diurutkan berdasarkan `created_at` dari terlama ke terbaru.\n\n**Scope Akses Berdasarkan Role:**\nAdmin, Tour Leader (kloter assigned), dan Jamaah (pemilik SOS) yang memiliki akses ke laporan SOS ini."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
                properties:
                  message:
                    type: string
                    example: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
      tags:
        - 'Modul Darurat / Emergency / SOS'
    post:
      summary: 'Menambahkan response / keterangan baru pada SOS Incident'
      operationId: menambahkanResponseKeteranganBaruPadaSOSIncident
      description: "Menambahkan tanggapan, pesan, atau catatan penanganan baru pada laporan SOS Incident.\n\n**Aturan Penentuan Aktor Otomatis:**\n* Aktor penanggap ditentukan otomatis berdasarkan token autentikasi yang sedang aktif (`jamaah_id`, `tour_leader_id`, atau `internal_user_id`).\n* Client **tidak boleh** dan **tidak perlu** mengirimkan actor ID di request body."
      parameters: []
      responses: {}
      tags:
        - 'Modul Darurat / Emergency / SOS'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: 'Pesan atau catatan tanggapan penanganan SOS (maksimal 5000 karakter).'
                  example: 'Tim medis sudah tiba di lokasi dan penanganan sedang berjalan.'
              required:
                - message
    parameters:
      -
        in: path
        name: sosIncident_id
        description: 'The ID of the sosIncident.'
        example: 01a0d96c-1e72-7144-83eb-2a1d35530e00
        required: true
        schema:
          type: string
      -
        in: path
        name: sosIncident
        description: 'UUID laporan SOS Incident.'
        example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        required: true
        schema:
          type: string
  /api/login:
    post:
      summary: ''
      operationId: postApiLogin
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: architecto
              required:
                - email
                - password
  /api/jamaah/login:
    post:
      summary: ''
      operationId: postApiJamaahLogin
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login_id:
                  type: string
                  description: ''
                  example: architecto
              required:
                - login_id
  /api/family/login:
    post:
      summary: 'Login Family'
      operationId: loginFamily
      description: 'Login sebagai anggota keluarga Jamaah menggunakan `login_id` Jamaah yang terdaftar. Menghasilkan Sanctum Bearer Token dengan ability `family`. Token ini **hanya** berlaku untuk endpoint `/api/family/*`.'
      parameters: []
      responses:
        200:
          description: 'Login berhasil. Token Sanctum dengan ability `family` dikembalikan.'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Login Family berhasil.'
                  token: 3|abc123sanctumTokenExample
                  jamaah:
                    id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                    login_id: JM-001
                    full_name: 'Ahmad Fauzi'
                    status: active
                properties:
                  message:
                    type: string
                    example: 'Login Family berhasil.'
                  token:
                    type: string
                    example: 3|abc123sanctumTokenExample
                  jamaah:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                      login_id:
                        type: string
                        example: JM-001
                      full_name:
                        type: string
                        example: 'Ahmad Fauzi'
                      status:
                        type: string
                        example: active
        401:
          description: 'Jamaah tidak ditemukan atau status tidak aktif.'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Jamaah tidak ditemukan atau tidak aktif.'
                properties:
                  message:
                    type: string
                    example: 'Jamaah tidak ditemukan atau tidak aktif.'
        422:
          description: 'Validasi gagal — login_id tidak disertakan.'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The login id field is required.'
                  errors:
                    login_id:
                      - 'The login id field is required.'
                properties:
                  message:
                    type: string
                    example: 'The login id field is required.'
                  errors:
                    type: object
                    properties:
                      login_id:
                        type: array
                        example:
                          - 'The login id field is required.'
                        items:
                          type: string
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login_id:
                  type: string
                  description: 'ID unik Jamaah (contoh: JM-001). Digunakan sebagai credential login. Tidak memerlukan password.'
                  example: JM-001
              required:
                - login_id
      security: []
  /api/jamaah/me:
    get:
      summary: ''
      operationId: getApiJamaahMe
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
                properties:
                  message:
                    type: string
                    example: 'Unauthenticated. Token autentikasi (Bearer token) tidak disertakan atau telah kadaluarsa.'
      tags:
        - Endpoints
  /api/jamaah/logout:
    post:
      summary: ''
      operationId: postApiJamaahLogout
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
  /api/family/me:
    get:
      summary: 'Profil Jamaah (Family Mode)'
      operationId: profilJamaahFamilyMode
      description: 'Mengambil data profil Jamaah beserta informasi kloter, hotel, tour leader, dan mutawif untuk ditampilkan di aplikasi mobile anggota keluarga. Memerlukan Bearer Token dengan ability `family`.'
      parameters: []
      responses:
        200:
          description: 'Data profil Jamaah berhasil diambil.'
          content:
            application/json:
              schema:
                type: object
                example:
                  jamaah:
                    id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                    login_id: JM-001
                    full_name: 'Ahmad Fauzi'
                    status: active
                    package:
                      id: d1122334-5566-7788-9900-112233445567
                      name: 'Paket Executive'
                    kloter:
                      id: c1122334-5566-7788-9900-112233445566
                      name: 'Kloter Reguler Syawal 1447H'
                      departure_date: '2026-10-01'
                      return_date: '2026-10-12'
                      hotel_makkah:
                        name: 'Hotel Safwah Tower'
                      hotel_madinah:
                        name: 'Pullman Zamzam'
                      tour_leaders:
                        -
                          name: 'Ustadz Abdullah'
                      mutawifs:
                        -
                          name: 'Syeikh Ahmad'
                properties:
                  jamaah:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                      login_id:
                        type: string
                        example: JM-001
                      full_name:
                        type: string
                        example: 'Ahmad Fauzi'
                      status:
                        type: string
                        example: active
                      package:
                        type: object
                        properties:
                          id:
