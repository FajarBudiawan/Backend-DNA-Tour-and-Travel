      - POST
    uri: api/sos-incidents
    metadata:
      custom: []
      groupName: 'Modul Darurat / Emergency / SOS'
      groupDescription: |-

        API untuk mengelola laporan kejadian darurat (SOS Incident) dari Jamaah dan penanganannya oleh Admin/Tour Leader.
      subgroup: ''
      subgroupDescription: ''
      title: 'Membuat laporan SOS baru'
      description: |-
        Membuat laporan kejadian darurat (SOS Incident) baru.

        **Aturan Autentikasi & Authorization:**
        * **Jamaah (`jamaah`):** Dapat membuat SOS untuk dirinya sendiri. Field `jamaah_id` **tidak perlu dikirim** oleh client karena diisi otomatis dari token Jamaah.
        * **Admin (`admin`):** Dapat membuat SOS atas nama Jamaah dan **wajib menentukan** `jamaah_id` di request body. Jika `jamaah_id` kosong/tidak disertakan, mengembalikan response error `422 Unprocessable Entity`.
        * **Tour Leader (`tour_leader`):** **Tidak diperbolehkan** membuat SOS dan menghasilkan response error `403 Forbidden` (`Tour Leader tidak dapat membuat SOS.`).

        **Aturan Penentuan Field Otomatis oleh Backend:**
        * `kloter_id`: Diambil otomatis dari `jamaah.kloter_id`.
        * `status`: Bernilai awal `'triggered'`.
        * `triggered_at`: Diisi otomatis dengan timestamp `now()`.
        * Record awal pada `sos_status_histories` dibuat otomatis (`old_status: null`, `new_status: 'triggered'`).
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {token}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      jamaah_id:
        custom: []
        name: jamaah_id
        description: 'UUID Jamaah yang mengalami darurat. Wajib dikirim oleh Admin, diabaikan/diisi otomatis jika login sebagai Jamaah.'
        required: false
        example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      type:
        custom: []
        name: type
        description: 'Jenis kejadian darurat (misal: "Darurat Medis", "Tersesat", "Kecelakaan").'
        required: true
        example: 'Darurat Medis'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      description:
        custom: []
        name: description
        description: 'Rincian deskripsi kondisi darurat yang dialami.'
        required: false
        example: 'Jamaah mengalami pusing dan sesak napas.'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      location_name:
        custom: []
        name: location_name
        description: 'Nama lokasi atau deskripsi landmark tempat kejadian.'
        required: false
        example: 'Pelataran Tawaf Gate 1'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      latitude:
        custom: []
        name: latitude
        description: 'Koordinat latitude lokasi kejadian (-90 s/d 90).'
        required: true
        example: 21.4225
        type: number
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      longitude:
        custom: []
        name: longitude
        description: 'Koordinat longitude lokasi kejadian (-180 s/d 180).'
        required: true
        example: 39.8262
        type: number
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
