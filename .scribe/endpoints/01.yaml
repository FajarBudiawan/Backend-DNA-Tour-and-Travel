name: 'Mobile Authentication'
description: 'Autentikasi untuk pengguna Mobile App (Jamaah, Anggota Keluarga, dan Tour Leader) menggunakan Laravel Sanctum dengan ability token berbasis role.'
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/jamaah/login
    metadata:
      custom: []
      groupName: 'Mobile Authentication'
      groupDescription: 'Autentikasi untuk pengguna Mobile App (Jamaah, Anggota Keluarga, dan Tour Leader) menggunakan Laravel Sanctum dengan ability token berbasis role.'
      subgroup: Jamaah
      subgroupDescription: 'Login sebagai Jamaah untuk mengakses profil dan informasi perjalanan umrah.'
      title: 'Login Jamaah'
      description: 'Login sebagai Jamaah menggunakan `login_id` yang terdaftar. Menghasilkan Sanctum Bearer Token dengan ability `jamaah`. Token ini **hanya** berlaku untuk endpoint `/api/jamaah/*`. Jamaah harus berstatus `active`.'
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      login_id:
        custom: []
        name: login_id
        description: 'ID unik Jamaah (contoh: JM-001). Digunakan sebagai credential login. Tidak memerlukan password.'
        required: true
        example: JM-001
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      login_id: architecto
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"message":"Login berhasil.","token":"2|abc123sanctumTokenExample","jamaah":{"id":"9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d","login_id":"JM-001","full_name":"Ahmad Fauzi","status":"active"}}'
        headers:
          content-type: application/json
        description: 'Login berhasil. Token Sanctum dengan ability `jamaah` dikembalikan.'
      -
        custom: []
        status: 401
        content: '{"message":"Jamaah tidak ditemukan atau tidak aktif."}'
        headers:
          content-type: application/json
        description: 'Jamaah tidak ditemukan atau status tidak aktif.'
      -
        custom: []
        status: 422
        content: '{"message":"The login id field is required.","errors":{"login_id":["The login id field is required."]}}'
        headers:
          content-type: application/json
        description: 'Validasi gagal — login_id tidak disertakan.'
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
    controller: null
    method: null
    route: null
